<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagrama Colaborare — Gestionare Useri</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      padding: 40px 24px;
    }
    .diagram-wrap {
      background: #ffffff;
      border: 1.5px solid #b0b0b0;
      border-radius: 4px;
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
    }
    .package-label { font-size: 11px; fill: #333; font-family: Arial, sans-serif; }
    .actor-label { font-size: 12px; fill: #1a1a2e; font-family: Arial, sans-serif; text-anchor: middle; }
    .usecase-label { font-size: 11px; fill: #1a1a2e; font-family: Arial, sans-serif; text-anchor: middle; }
    .system-label { font-size: 11px; fill: #1a1a2e; font-family: Arial, sans-serif; text-anchor: middle; }
    .fig-caption { text-align: center; margin-top: 16px; font-size: 0.88rem; color: #222; }
    .fig-caption strong { font-weight: 700; }
  </style>
</head>
<body>
  <div class="diagram-wrap">
    <svg width="780" height="420" xmlns="http://www.w3.org/2000/svg">

      <rect x="10" y="10" width="760" height="390" fill="none" stroke="#555" stroke-width="1.2"/>
      <text x="18" y="24" class="package-label">object Package1</text>

      <!-- Actor: Admin (top-left) -->
      <g>
        <circle cx="90" cy="90" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="108" x2="90" y2="155" stroke="#333" stroke-width="1.4"/>
        <line x1="60" y1="130" x2="120" y2="130" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="155" x2="65" y2="185" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="155" x2="115" y2="185" stroke="#333" stroke-width="1.4"/>
        <text x="90" y="205" class="actor-label">Admin</text>
      </g>

      <!-- Actor: SuperAdmin (bottom-left) -->
      <g>
        <circle cx="90" cy="290" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="308" x2="90" y2="355" stroke="#333" stroke-width="1.4"/>
        <line x1="60" y1="330" x2="120" y2="330" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="355" x2="65" y2="385" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="355" x2="115" y2="385" stroke="#333" stroke-width="1.4"/>
        <text x="90" y="402" class="actor-label">SuperAdmin</text>
      </g>

      <!-- Actor: UserTinta (top-right) -->
      <g>
        <circle cx="680" cy="90" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="108" x2="680" y2="155" stroke="#333" stroke-width="1.4"/>
        <line x1="650" y1="130" x2="710" y2="130" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="155" x2="655" y2="185" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="155" x2="705" y2="185" stroke="#333" stroke-width="1.4"/>
        <text x="680" y="205" class="actor-label">UserTinta</text>
      </g>

      <!-- Actor: UserTintaRol (bottom-right) -->
      <g>
        <circle cx="680" cy="290" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="308" x2="680" y2="355" stroke="#333" stroke-width="1.4"/>
        <line x1="650" y1="330" x2="710" y2="330" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="355" x2="655" y2="385" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="355" x2="705" y2="385" stroke="#333" stroke-width="1.4"/>
        <text x="680" y="402" class="actor-label">UserTintaRol</text>
      </g>

      <!-- UseCase: Gestioneaza_userii (top center) -->
      <ellipse cx="385" cy="110" rx="125" ry="45" fill="#f5deb3" fill-opacity="0.5" stroke="#8b6914" stroke-width="1.4" stroke-dasharray="6,3"/>
      <text x="385" y="105" class="usecase-label">Gestioneaza</text>
      <text x="385" y="120" class="usecase-label">_userii</text>

      <!-- UseCase: Schimba_rol_user (bottom center) -->
      <ellipse cx="385" cy="300" rx="125" ry="45" fill="#f5deb3" fill-opacity="0.5" stroke="#8b6914" stroke-width="1.4" stroke-dasharray="6,3"/>
      <text x="385" y="295" class="usecase-label">Schimba</text>
      <text x="385" y="310" class="usecase-label">_rol_user</text>

      <!-- System: Admin Panel -->
      <rect x="520" y="65" width="115" height="40" rx="3" fill="#b2d8d8" fill-opacity="0.6" stroke="#2a7a7a" stroke-width="1.2"/>
      <text x="577" y="90" class="system-label">Admin Panel</text>

      <!-- System: userService -->
      <rect x="520" y="265" width="115" height="40" rx="3" fill="#b2d8d8" fill-opacity="0.6" stroke="#2a7a7a" stroke-width="1.2"/>
      <text x="577" y="290" class="system-label">userService</text>

      <!-- Association lines -->
      <line x1="108" y1="100" x2="260" y2="108" stroke="#333" stroke-width="1.2"/>
      <line x1="662" y1="100" x2="510" y2="108" stroke="#333" stroke-width="1.2"/>
      <line x1="520" y1="85" x2="510" y2="108" stroke="#333" stroke-width="1.2"/>
      <line x1="385" y1="155" x2="385" y2="255" stroke="#333" stroke-width="1.2"/>
      <line x1="108" y1="300" x2="260" y2="300" stroke="#333" stroke-width="1.2"/>
      <line x1="662" y1="300" x2="510" y2="300" stroke="#333" stroke-width="1.2"/>
      <line x1="510" y1="285" x2="520" y2="280" stroke="#333" stroke-width="1.2"/>

      <!-- Generalization arrows -->
      <line x1="90" y1="215" x2="90" y2="268" stroke="#333" stroke-width="1.2"/>
      <polygon points="90,270 82,255 98,255" fill="none" stroke="#333" stroke-width="1.2"/>

      <line x1="680" y1="215" x2="680" y2="268" stroke="#333" stroke-width="1.2"/>
      <polygon points="680,270 672,255 688,255" fill="none" stroke="#333" stroke-width="1.2"/>

    </svg>
  </div>
  <p class="fig-caption">Fig.3 Reprezentarea functionalitatii „Gestionare Useri" <strong>(nivelul de specificare)</strong></p>
</body>
</html>
