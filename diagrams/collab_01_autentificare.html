<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagrama Colaborare — Autentificare User</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      padding: 40px 24px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1a1a2e;
    }
    header p {
      font-size: 0.85rem;
      color: #555;
      margin-top: 4px;
    }
    .diagram-wrap {
      background: #ffffff;
      border: 1.5px solid #b0b0b0;
      border-radius: 4px;
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
    }
    .package-label {
      font-size: 11px;
      fill: #333;
      font-family: Arial, sans-serif;
    }
    .actor-label {
      font-size: 12px;
      fill: #1a1a2e;
      font-family: Arial, sans-serif;
      text-anchor: middle;
    }
    .usecase-label {
      font-size: 11px;
      fill: #1a1a2e;
      font-family: Arial, sans-serif;
      text-anchor: middle;
    }
    .system-label {
      font-size: 11px;
      fill: #1a1a2e;
      font-family: Arial, sans-serif;
      text-anchor: middle;
    }
    .fig-caption {
      text-align: center;
      margin-top: 16px;
      font-size: 0.88rem;
      color: #222;
    }
    .fig-caption strong { font-weight: 700; }
  </style>
</head>
<body>
  <div class="diagram-wrap">
    <svg width="780" height="420" xmlns="http://www.w3.org/2000/svg">

      <!-- Package border -->
      <rect x="10" y="10" width="760" height="390" fill="none" stroke="#555" stroke-width="1.2"/>
      <text x="18" y="24" class="package-label">object Package1</text>

      <!-- ========== ACTORS ========== -->

      <!-- Actor: User (top-left) -->
      <g id="actor-user">
        <circle cx="90" cy="90" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="108" x2="90" y2="155" stroke="#333" stroke-width="1.4"/>
        <line x1="60" y1="130" x2="120" y2="130" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="155" x2="65" y2="185" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="155" x2="115" y2="185" stroke="#333" stroke-width="1.4"/>
        <text x="90" y="205" class="actor-label">User</text>
      </g>

      <!-- Actor: UserNou (bottom-left) -->
      <g id="actor-usernew">
        <circle cx="90" cy="290" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="308" x2="90" y2="355" stroke="#333" stroke-width="1.4"/>
        <line x1="60" y1="330" x2="120" y2="330" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="355" x2="65" y2="385" stroke="#333" stroke-width="1.4"/>
        <line x1="90" y1="355" x2="115" y2="385" stroke="#333" stroke-width="1.4"/>
        <text x="90" y="402" class="actor-label">UserNou</text>
      </g>

      <!-- Actor: Admin (top-right) -->
      <g id="actor-admin">
        <circle cx="680" cy="90" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="108" x2="680" y2="155" stroke="#333" stroke-width="1.4"/>
        <line x1="650" y1="130" x2="710" y2="130" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="155" x2="655" y2="185" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="155" x2="705" y2="185" stroke="#333" stroke-width="1.4"/>
        <text x="680" y="205" class="actor-label">Admin</text>
      </g>

      <!-- Actor: AuthSystem (bottom-right) -->
      <g id="actor-authsys">
        <circle cx="680" cy="290" r="18" fill="none" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="308" x2="680" y2="355" stroke="#333" stroke-width="1.4"/>
        <line x1="650" y1="330" x2="710" y2="330" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="355" x2="655" y2="385" stroke="#333" stroke-width="1.4"/>
        <line x1="680" y1="355" x2="705" y2="385" stroke="#333" stroke-width="1.4"/>
        <text x="680" y="402" class="actor-label">AuthAdmin</text>
      </g>

      <!-- ========== USE CASES (ellipses dashed) ========== -->

      <!-- UseCase: Autentifica_user (top center) -->
      <ellipse cx="385" cy="110" rx="120" ry="45" fill="#f5deb3" fill-opacity="0.5" stroke="#8b6914" stroke-width="1.4" stroke-dasharray="6,3"/>
      <text x="385" y="105" class="usecase-label">Autentifica</text>
      <text x="385" y="120" class="usecase-label">_user</text>

      <!-- UseCase: Valideaza_credentiale (bottom center) -->
      <ellipse cx="385" cy="300" rx="120" ry="45" fill="#f5deb3" fill-opacity="0.5" stroke="#8b6914" stroke-width="1.4" stroke-dasharray="6,3"/>
      <text x="385" y="295" class="usecase-label">Valideaza</text>
      <text x="385" y="310" class="usecase-label">_credentiale</text>

      <!-- ========== SYSTEM BOX ========== -->
      <rect x="530" y="270" width="110" height="40" rx="3" fill="#b2d8d8" fill-opacity="0.6" stroke="#2a7a7a" stroke-width="1.2"/>
      <text x="585" y="295" class="system-label">AuthContext</text>

      <!-- ========== ASSOCIATION LINES ========== -->

      <!-- User -> Autentifica_user -->
      <line x1="108" y1="100" x2="265" y2="108" stroke="#333" stroke-width="1.2"/>

      <!-- Admin -> Autentifica_user -->
      <line x1="662" y1="100" x2="505" y2="108" stroke="#333" stroke-width="1.2"/>

      <!-- Autentifica_user -> Valideaza_credentiale (vertical) -->
      <line x1="385" y1="155" x2="385" y2="255" stroke="#333" stroke-width="1.2"/>

      <!-- UserNou -> Valideaza_credentiale -->
      <line x1="108" y1="300" x2="265" y2="300" stroke="#333" stroke-width="1.2"/>

      <!-- AuthAdmin -> Valideaza_credentiale -->
      <line x1="662" y1="300" x2="505" y2="300" stroke="#333" stroke-width="1.2"/>

      <!-- Valideaza_credentiale -> AuthContext -->
      <line x1="505" y1="300" x2="530" y2="291" stroke="#333" stroke-width="1.2"/>

      <!-- ========== GENERALIZATION ARROWS (hollow triangle) ========== -->

      <!-- User -> UserNou (generalization, left side) -->
      <line x1="90" y1="215" x2="90" y2="268" stroke="#333" stroke-width="1.2"/>
      <polygon points="90,270 82,255 98,255" fill="none" stroke="#333" stroke-width="1.2"/>

      <!-- Admin -> AuthAdmin (generalization, right side) -->
      <line x1="680" y1="215" x2="680" y2="268" stroke="#333" stroke-width="1.2"/>
      <polygon points="680,270 672,255 688,255" fill="none" stroke="#333" stroke-width="1.2"/>

    </svg>
  </div>
  <p class="fig-caption">Fig.1 Reprezentarea functionalitatii „Autentificare User" <strong>(nivelul de specificare)</strong></p>
</body>
</html>
